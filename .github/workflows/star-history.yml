name: Update Star History
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: star-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render authenticated GitHub snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_star_history.py --repo "$GITHUB_REPOSITORY"
      - name: Commit updated chart
        run: |
          git add docs/star-history.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Star History snapshot'
          git push
